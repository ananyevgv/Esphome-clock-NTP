##  |39|       |26| clk      |#|     |22| scl      |25|          ##
##  |35|       |18| IR       |#|     |21| sda      |32|          ##
##  |33|       |19| mosi     |#|     |17| dallas   |12|          ##
##  |34|       |23| PM       |#|     |16| cs       | 4|          ##
##  |14|       | 5|          |#|     |GN|          | 0|          ## 
##  |NC|       |3V|          |#|     |5V|          | 2|          ##
##  | 9|       |13|          |#|     |15|          | 8|          ##
##  |11|       |10|          |#|     | 7|          | 6|          ##
###################################################################
###########################################################
##                    WEMOS S2 mini                      ##
##  |EN|       | 1|       |#|     |40|     |39| R_OT     ##
##  | 3| MQ    | 2|       |#|     |38|     |37| W_OT     ##
##  | 5| clk   | 4|       |#|     |36|     |35| scl      ##
##  | 7| IR    | 6|       |#|     |34|     |33| sda      ##
##  | 9| mosi  | 8|       |#|     |21|     |18| dallas   ##
##  |11| PM    |10|       |#|     |17|     |16| cs       ##
##  |12|       |13|       |#|     |GN|     |GN|          ## 
##  |3V|       |14|       |#|     |15|     |5V|          ##
###########################################################
substitutions:
  name: "kitchen-clock"
  device_description: "Часы кухня"
  room: "Кухня"
  
esphome:
  name: "${name}"
  comment: "${device_description}"
  #environment_variables:
  #  ALL_PROXY: http://esphome:HG5hgd763kjsh@45.141.102.158:1971
    
esp32:
  board: wemos_d1_mini32
 # board: lolin_s2_mini
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1" 
      sram1_as_iram: true
      flash_chip: generic      
      
#psram:
 # mode: quad
 # speed: 40MHz   
  
logger:
    level: DEBUG
i2c:
  sda: 21 #33
  scl: 22 #35
  scan: true
  sda_pullup_enabled: False
  scl_pullup_enabled: False
  
spi:
  clk_pin: 26 #5 #26 
  mosi_pin: 19 #9 
  
one_wire:
  - platform: gpio
    pin: 17 #18

remote_transmitter:
  pin: 18 #7
  carrier_duty_percent: 50%
  non_blocking: true
#-------------------------------------------
# Packages
#------------------------------------------- 
packages:
  wifi: !include packages/wifi.yaml
  device_base: !include packages/device_base.yaml
 # sun: !include packages/sensor/sun.yaml
  time: !include included/time.yaml

  bh1750: !include
    file: packages/sensor/bh1750.yaml
    vars:
      id_bh: i_clock

  bme680_bsec: !include 
    file: packages/sensor/bme680_bsec2.yaml
    vars:
      id_bme680_t: kitchen_t
      id_bme680_h: kitchen_h
      id_bme680_p: bme680_p
      id_bme680_iaq: bme680_iaq
      id_bme680_co2: bme680_co2
      id_bme680_voc: bme680_voc
      model_bme: bme688
      address_bme680: 0x77
      t_offset: 0

sensor:
  - platform: adc
    id: i_clock2
  # name:  adc brightness
    pin: 36 #3
    attenuation: auto
    update_interval: 5s

  - platform: template
    id: brightness2
  #  name:  brightness
    lambda: |-
      uint16_t var2 = (id(i_clock2).state * 100);
      switch (var2) {
        case 0 ... 100: return 7; break;
        case 101 ... 200: return 6; break;
        case 201 ... 250: return 5; break;
        case 251 ... 280: return 4; break;
        case 281 ... 300: return 3; break;
        case 301 ... 310: return 2; break;
        case 311 ... 320: return 1; break;
        case 321 ... 340: return 0; break;
        default: return 8; break;
      }
    
    update_interval: 5s
  - platform: dallas_temp
    name: "pol_t"

  - platform: template
    id: brightness
    lambda: |-
      uint8_t var = (id(i_clock).state);
      switch (var) {
        case 0 ... 9: return 0; break;
        case 10 ... 19: return 1; break;
        case 20 ... 29: return 2; break;
        case 30 ... 39: return 4; break;
        case 40 ... 49: return 8; break;
        case 50 ... 59: return 12; break;
        case 60 ... 100: return 15; break;
        default: return 0; break;
      }
    internal: true
    update_interval: 5s

  - platform: pulse_meter
    pin: 
      number: 23 #11 #23
      mode:
        input: true
        pulldown: true
    unit_of_measurement: 'l⁄min'
    name: "l⁄min"
    id: potok
    internal_filter: 5ms
    accuracy_decimals: 1
    timeout: 5s
    filters:
      - multiply: 0.0005
    total:
      name: "drink_water_filter"
      id: drink_water_filter
      unit_of_measurement: "L"
      device_class: water
      accuracy_decimals: 1
      filters:
        - multiply: 0.0005

  - platform: homeassistant
    #name: "water_total"
    entity_id: sensor.potreblenie_pitevoi_vody
    id: drink_water_yearly
    accuracy_decimals: 1
    internal: True
    
button:
  - platform: template
    name: "Power LG"
    icon: mdi:television-classic
    on_press:
      - remote_transmitter.transmit_lg:
         data: 0x20DF10EF # power on/off0x20DF08F7
         nbits: 32
         repeat: 3

display:
  - platform: max7219
    cs_pin: 16
    num_chips: 3
    lambda: |-
      it.set_intensity((int) id(brightness).state);
      // int b = (int) id(brightness).state;
      // if (b >= 0 && b <= 15) it.set_intensity(b);
      static int i = 0;
      i++;
      it.strftime(14,"%S", id(sntp_time).now());
      it.printf(16,"%.1f~" , id(kitchen_t).state);
      it.printf(20,"%.1fh" , id(kitchen_h).state);

      if ((id(drink_water_yearly).state) > 10000)
        it.printf(8,"ErrorF");
      else 
        it.printf(8,"%5.1f" , id(drink_water_yearly).state);
 
      if ((i % 2) == 0) 
        it.strftime(4,"%H.%M", id(sntp_time).now());
      else 
        it.strftime(4,"%H%M", id(sntp_time).now()); 